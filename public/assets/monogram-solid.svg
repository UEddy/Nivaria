<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 400 400" fill="none" role="img" aria-label="Nivaria">
  <!-- Nivaria monogram: a deep cobalt tile with a faint tonal shift and a
       hairline inner edge, and the N drawn as two stems and a bold diagonal
       with a narrow stencil cut on each side. -->
  <defs>
    <linearGradient id="nv-tile" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3550E8"/>
      <stop offset="1" stop-color="#2236C0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="88" fill="url(#nv-tile)"/>
  <rect x="2.5" y="2.5" width="395" height="395" rx="85.5" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"/>
  <g fill="#FFFFFF">
    <rect x="94" y="92" width="58" height="216"/>
    <rect x="248" y="92" width="58" height="216"/>
    <path d="M162 92h56l20 216h-56z"/>
  </g>
</svg>
