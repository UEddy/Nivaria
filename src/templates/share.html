  <!-- Anti-flash theme: the visitor's saved choice on this site, else the system's. -->
  <script>
  (function () {
    var v = 'system';
    try { v = localStorage.getItem('cs-theme') || 'system'; } catch (e) {}
    var r = v === 'system'
      ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : v;
    document.documentElement.setAttribute('data-theme', r);
  })();
  </script>
